name: Build Dev APK (fork)

# 只构建 dev 变体：包名带 .dev 后缀，可与官方版共存，不需要签名密钥
# 用法：Actions -> Build Dev APK (fork) -> Run workflow
on:
  workflow_dispatch:

jobs:
  android-dev:
    runs-on: ubuntu-latest
    steps:
      - name: 代码迁出
        uses: actions/checkout@v7

      - name: 构建Java环境
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"
          cache-dependency-path: |
            android/*.gradle*
            android/**/gradle-wrapper.properties

      - name: 安装Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      # 与上游 CI 一致：给 Flutter SDK 和 material_ui 打补丁（脚本内部会跑 flutter pub get）
      - name: Apply Patch
        shell: pwsh
        run: lib/scripts/patch.ps1 android

      - name: 构建 dev APK
        run: flutter build apk --release --split-per-abi --android-project-arg dev=1 --no-pub

      - name: 上传 arm64-v8a
        uses: actions/upload-artifact@v7
        with:
          name: PiliPlus-dev-arm64-v8a
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: 上传 armeabi-v7a
        uses: actions/upload-artifact@v7
        with:
          name: PiliPlus-dev-armeabi-v7a
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
