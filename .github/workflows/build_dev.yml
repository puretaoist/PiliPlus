name: Build Dev APK (fork)

# 构建 dev 变体：包名带 .dev 后缀，可与官方版共存，不需要签名密钥
# 触发：每次 push 到 main 自动构建；也可在 Actions 页手动触发
on:
  push:
    branches: [main]
  workflow_dispatch:

# 连续 push 时取消进行中的旧构建，避免排队堆积、节省 Actions 额度
concurrency:
  group: build-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-dev:
    runs-on: ubuntu-latest
    steps:
      - name: 代码迁出
        uses: actions/checkout@v7

      - name: 构建Java环境
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"
          cache-dependency-path: |
            android/*.gradle*
            android/**/gradle-wrapper.properties

      - name: 安装Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      # 与上游 CI 一致：给 Flutter SDK 和 material_ui 打补丁（脚本内部会跑 flutter pub get）
      - name: Apply Patch
        shell: pwsh
        run: lib/scripts/patch.ps1 android

      # 若仓库配置了固定签名密钥（4 个 secret），用它签名，这样多次构建可以覆盖安装；
      # 没配置则回退到 runner 的 debug 密钥（每次构建都不同，无法覆盖安装）
      - name: 写入签名密钥
        run: |
          if [ ! -z "${{ secrets.SIGN_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.SIGN_KEYSTORE_BASE64 }}" | base64 --decode > android/app/key.jks
            echo storeFile='key.jks' >> android/key.properties
            echo storePassword='${{ secrets.KEYSTORE_PASSWORD }}' >> android/key.properties
            echo keyAlias='${{ secrets.KEY_ALIAS }}' >> android/key.properties
            echo keyPassword='${{ secrets.KEY_PASSWORD }}' >> android/key.properties
          fi

      # 构建标识进 artifact 名字：同一个 workflow 的 artifact 名字以前完全一样，
      # 很容易从**旧的 run** 里下到旧 APK，然后以为"新包没生效"
      - name: 记录构建标识
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      # 带上 commit hash：BuildConfig.commitHash 会进日志的 customParameters，
      # 这样拿到一份导出的日志就能确定它是哪个构建产出的
      # （以前只能靠"日志里出现了哪些行"反推是哪版，2026-09-12 因此误判过一次）。
      # 注意**不要**传 pili.time —— 自构建版本靠 buildTime == 0 跳过更新检查
      - name: 构建 dev APK
        run: |
          flutter build apk --release --split-per-abi --android-project-arg dev=1 --no-pub \
            --dart-define=pili.hash=$SHORT_SHA

      # 打出签名指纹：与上一次构建对比就能确认"固定签名密钥"到底配没配。
      # 每次构建都用新 debug 密钥的话，APK 无法覆盖安装（必须先卸载旧版）
      - name: 打印构建标识与签名指纹
        run: |
          echo "commit=$SHORT_SHA"
          keytool -printcert -jarfile build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            | grep -E 'Owner:|SHA256:' || true

      - name: 上传 arm64-v8a
        uses: actions/upload-artifact@v7
        with:
          name: PiliPlus-dev-arm64-v8a-${{ env.SHORT_SHA }}
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: 上传 armeabi-v7a
        uses: actions/upload-artifact@v7
        with:
          name: PiliPlus-dev-armeabi-v7a-${{ env.SHORT_SHA }}
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
